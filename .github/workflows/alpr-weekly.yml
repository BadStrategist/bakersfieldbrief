name: ALPR Weekly Diff (Mon)

# /surveillance/ needs a weekly Overpass diff: append the change-log row, advance
# the node snapshot, commit those two artifacts, deploy. This ran on the local box
# (hermes/scripts/alpr_weekly.sh) and needed the box awake, and Overpass returned
# HTTP 406 from that machine. CI has neither problem, so the diff lives here now.
on:
  schedule:
    # 12:30 UTC = 05:30 PT Monday. Off the :07/:37 content slots.
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  alpr:
    runs-on: ubuntu-latest
    env:
      # Same key set as daily.yml so the site build stays faithful; a source with
      # no key degrades gracefully (an error dict) rather than failing the job.
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      ALERTLINE_API_KEY: ${{ secrets.ALERTLINE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # One build with change recording: fetches all sources, appends the ALPR
      # weekly change-log row, advances the snapshot, rebuilds the site.
      - name: Weekly diff (records the change-log row + advances the snapshot)
        run: python build/build_all.py --no-llm --alpr-change

      # FAIL LOUDLY if the Overpass/OSM fetch failed, or if no change-log entry was
      # recorded for today. A silent "ok" would freeze the page with no signal.
      - name: Verify the fetch and the change-log row
        run: |
          python - <<'PY'
          import datetime, json, sys
          d = json.load(open('data/source_cache.json', encoding='utf-8'))
          a = d.get('alpr') or {}
          if not a.get('ok'):
              print(f"ERROR: Overpass/OSM fetch failed this run: {a.get('error', 'unknown')}", file=sys.stderr)
              sys.exit(1)
          cl = a.get('change_log', [])
          last = cl[-1] if cl else {}
          print(f"fetch OK - total={a.get('stats', {}).get('total')} "
                f"flock={a.get('stats', {}).get('flock')} last_log={last.get('date')}")
          if last.get('date') != datetime.date.today().isoformat():
              print(f"ERROR: no change-log entry recorded for today (last={last.get('date')})", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Test suite (hard gate before deploy)
        run: python -m pytest -q -o addopts="" --tb=short

      # Only the two tracked artifacts the diff touches. data/source_cache.json is
      # gitignored and must never be added.
      - name: Commit the two tracked artifacts
        continue-on-error: true
        run: |
          bash scripts/ci_push.sh "tracker: ALPR weekly diff $(date -u +%Y-%m-%d) [skip ci]"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=bakersfieldbrief
