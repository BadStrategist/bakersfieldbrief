name: Daily Brief (6am PT)

on:
  schedule:
    # Run at 13:00 and 14:00 UTC so the 6am-Pacific gate below hits 6:00 PT
    # year-round regardless of daylight saving. The second run exits early.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate to 6am Pacific
        id: gate
        run: |
          H=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/Los_Angeles')).hour)")
          echo "hour=$H" >> "$GITHUB_OUTPUT"
          echo "Pacific hour is $H (build runs when == 6)"

      - name: Install dependencies
        if: steps.gate.outputs.hour == '6' || github.event_name == 'workflow_dispatch'
        run: pip install -q -r requirements.txt

      - name: Build site (fetch sources → bake static HTML)
        if: steps.gate.outputs.hour == '6' || github.event_name == 'workflow_dispatch'
        run: python build/build_all.py

      # Automatic pusher: commit the generated artifacts (email/, drafts/, data/)
      # so the email renderings and review drafts are always in the repo.
      - name: Commit generated artifacts
        if: steps.gate.outputs.hour == '6' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email drafts data
          if ! git diff --cached --quiet; then
            git commit -m "build: $(date -u +%Y-%m-%d) artifacts [skip ci]"
            # concurrent workflows can race the push — rebase and retry
            for i in 1 2 3; do
              git rebase --abort 2>/dev/null
              if git pull --rebase origin main --autostash && git push; then break; fi
              echo "push retry $i"; sleep 8
            done
          else
            echo "no artifact changes"
          fi

      - name: Upload Pages artifact
        if: steps.gate.outputs.hour == '6' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.hour == '6' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
