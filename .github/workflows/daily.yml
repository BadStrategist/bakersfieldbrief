name: Daily Brief (6am PT)

on:
  push:
    branches: [main]
  schedule:
    # Every 3h UTC: cheap LLM-free refreshes so conditions (weather, AQI,
    # active fires, reservoir, CHP) stay current. The 13:00/14:00 UTC pair
    # guarantees a 6:00-PT LLM build year-round (DST-proof).
    - cron: "0 */3 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate to 6am Pacific
        id: gate
        run: |
          H=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/Los_Angeles')).hour)")
          echo "hour=$H" >> "$GITHUB_OUTPUT"
          # LLM only at the 6:00 PT build (and any push/dispatch run);
          # the 3-hourly refreshes build LLM-free.
          if [ "$H" = "6" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "llm=1" >> "$GITHUB_OUTPUT"
          else
            echo "llm=0" >> "$GITHUB_OUTPUT"
          fi
          # The 7:00 PT run waits for the overnight: phase 2 publishes
          # ~7:00-7:10 PT (the 6:30 cron + push), so retry the gate for up
          # to 25 min. Other runs must not burn CI minutes on a report
          # that hasn't landed yet (6:00) or has long since landed (8:00+).
          if [ "$H" = "7" ]; then
            echo "retry=25" >> "$GITHUB_OUTPUT"
          else
            echo "retry=0" >> "$GITHUB_OUTPUT"
          fi
          echo "Pacific hour is $H (LLM build when == 6, FB gate retry ${retry:-0} min)"

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          # brief_reel/render_reel.py needs ffmpeg (raw-frame pipe + audio
          # mix); the runner image does NOT ship it — without this the reel
          # build crashes and the daily post silently falls back to a photo.
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Build site (fetch sources → bake static HTML)
        run: python build/build_all.py ${{ steps.gate.outputs.llm == '0' && '--no-llm' || '' }}

      # UptimeRobot freshness ping: fires ONLY when today's Kern Overnight
      # report exists in the repo (i.e. the overnight pipeline ran and
      # pushed). A missed publish = missed ping = UptimeRobot alert.
      # The URL comes from a Cron-monitor in UptimeRobot (see
      # scripts/resilience-setup.md); until the secret is set, this skips.
      - name: Ping UptimeRobot if today's overnight report exists
        if: (steps.gate.outputs.hour == '6' || github.event_name != 'schedule') && env.UP_OVERNIGHT_PING_URL != ''
        env:
          UP_OVERNIGHT_PING_URL: ${{ secrets.UP_OVERNIGHT_PING_URL }}
        run: |
          TODAY=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/Los_Angeles')).strftime('%Y-%m-%d'))")
          if [ -f "data/overnight_reports/$TODAY.md" ]; then
            curl -fsS -m 20 "$UP_OVERNIGHT_PING_URL" && echo "overnight ping sent ($TODAY)"
          else
            echo "no overnight report for $TODAY — ping skipped (alert is the correct signal)"
          fi

      # Automatic pusher: commit the generated artifacts (email/, drafts/, data/)
      # so the email renderings and review drafts are always in the repo.
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email drafts data
          if ! git diff --cached --quiet; then
            git commit -m "build: $(date -u +%Y-%m-%d) artifacts [skip ci]"
            # concurrent workflows can race the push — rebase and retry
            for i in 1 2 3; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase origin main --autostash; then
                git push && break
              else
                git checkout --ours -- data email drafts 2>/dev/null || true
                git add -A
                git -c core.editor=true rebase --continue 2>/dev/null || git rebase --abort
                git push && break
              fi
              echo "push retry $i"; sleep 8
            done
          else
            echo "no artifact changes"
          fi

      # Newsletter send: once per day at the 8:00 PT build (or any later
      # run — the gate is hour >= 8, not == 8, so a GitHub-schedule delay
      # that lands the run at 9:00/10:00 still sends instead of silently
      # skipping). NOTE: fromJSON() is required — a raw string comparison
      # ('15' >= '8') is lexicographic and fails for hours 10+.
      # The script is idempotent (checks MailerLite for today's campaign
      # first), so a delayed run + the Hermes watchdog can never double-send.
      # Without the key the script no-ops (prints the ready-to-send path) so
      # CI never breaks.
      # SEND RUNS AFTER THE DEPLOY so a blocked/failed email can never hold up
      # the site. It deliberately FAILS the job (NO continue-on-error) when the
      # email is blocked or the send errors — a skipped email must be a RED run
      # a human sees, never a silent green check — and a notification step posts
      # to the ops Discord channel so nobody has to grep run logs.
      - name: Test suite (hard gate before deploy)
        run: python -m pytest -q -o addopts="" --tb=short

      - name: Set MailerLite Pages secrets (for the newsletter function)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          MAILERLITE_GROUP_ID: ${{ secrets.MAILERLITE_GROUP_ID }}
        run: |
          echo "$MAILERLITE_API_TOKEN" | npx wrangler pages secret put MAILERLITE_API_TOKEN --project-name=bakersfieldbrief 2>&1 | tail -1
          echo "$MAILERLITE_GROUP_ID" | npx wrangler pages secret put MAILERLITE_GROUP_ID --project-name=bakersfieldbrief 2>&1 | tail -1

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=bakersfieldbrief

      # Newsletter send — runs AFTER deploy so a blocked/failed email can never
      # hold up the site, but NO continue-on-error: a blocked send exits 1 and
      # FAILS the job, so `gh run list` shows RED, not a silent green check.
      - name: Send daily newsletter (MailerLite)
        if: fromJSON(steps.gate.outputs.hour) >= 8
        id: send
        env:
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          MAILERLITE_GROUP_ID: ${{ secrets.MAILERLITE_GROUP_ID }}
        run: |
          set +e
          python scripts/send_newsletter_ml.py > /tmp/bb_send.out 2>&1
          code=$?
          cat /tmp/bb_send.out
          # surface the failure reason to the notify step (job-level env)
          { echo "BB_SEND_MSG<<EOF"; tail -6 /tmp/bb_send.out; echo "EOF"; } >> "$GITHUB_ENV"
          exit $code

      # A blocked/failed email must reach a human the same morning, not sit in
      # run logs. Posts to the ops Discord webhook when the send step failed.
      # `if: failure()` is the reliable GitHub Actions condition (fires when
      # any prior step in the job failed) — `steps.send.outcome == 'failure'`
      # proved unreliable and skipped the alert on 2026-09-06. Without the
      # secret it still fails loudly in the log (never silent).
      - name: Notify ops Discord if email was blocked/failed
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "!! DISCORD_WEBHOOK_URL secret not set - email blocked/failed and NO Discord alert could be sent. See $RUN_URL"
            exit 1
          fi
          printf 'A blocked/failed send is now a RED run - not silent.\n```\n' > /tmp/bb_discord.txt
          if [ -f /tmp/bb_send.out ]; then
            tail -6 /tmp/bb_send.out >> /tmp/bb_discord.txt
          else
            printf '(send step did not run - an earlier step failed and the email was never attempted)\n' >> /tmp/bb_discord.txt
          fi
          printf '\n```\nSee: %s\n' "$RUN_URL" >> /tmp/bb_discord.txt
          python scripts/notify_discord.py --header "Bakersfield Brief - daily email did NOT send (run #$GITHUB_RUN_NUMBER)" --file /tmp/bb_discord.txt
          echo "ops Discord alert sent for blocked/failed email"

      # Social post: DISABLED 2026-08-19 — API posts are withheld from the
      # public page on this new account (verified 6/6 held; only manual UI
      # posts render publicly). The daily kit (reel MP4 + card + caption) is
      # delivered to the #manual-posting-station Discord thread at 08:00 PT by
      # the KO manual posting kit cron job; the human posts it via Meta
      # Business Suite. To re-enable, uncomment this step.
