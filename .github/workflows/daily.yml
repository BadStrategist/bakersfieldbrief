name: Daily Brief (6am PT)

on:
  push:
    branches: [main]
    # A handover note or a doc is not a reason to rebuild and redeploy the site.
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    # Every 3h UTC: cheap LLM-free refreshes so conditions (weather, AQI,
    # active fires, reservoir, CHP) stay current. The 13:00/14:00 UTC pair
    # guarantees a 6:00-PT LLM build year-round (DST-proof). 16:00 UTC is 8:00 PST: in winter
    # no other slot lands on the 8 AM send (15:00 UTC is 7:00 PST, 18:00 UTC is 10:00).
    # Minute 7, not 0: GitHub queues scheduled runs, and the top of the hour is the busiest
    # slot (the 13:00 run was starting one to four hours late). Still inside the same Pacific
    # hour, so the 6 AM gate below reads exactly as before.
    - cron: "7 */3 * * *"
    - cron: "7 13 * * *"
    - cron: "7 14 * * *"
    - cron: "7 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      ALERTLINE_API_KEY: ${{ secrets.ALERTLINE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate to 6am Pacific
        id: gate
        run: |
          H=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/Los_Angeles')).hour)")
          echo "hour=$H" >> "$GITHUB_OUTPUT"
          # LLM at the 6:00 PT build, any push/dispatch run, and any 7-9 AM run
          # when today's brief was never written: GitHub starts scheduled runs
          # late or drops them, and the only 6 AM slot can land at 7. Once the
          # brief is cached, later runs reuse it and build LLM-free.
          D=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/Los_Angeles')).strftime('%Y-%m-%d'))")
          if [ "$H" = "6" ] || [ "${{ github.event_name }}" != "schedule" ] || { [ "$H" -ge 7 ] && [ "$H" -le 9 ] && [ ! -f "data/briefs/$D.json" ]; }; then
            echo "llm=1" >> "$GITHUB_OUTPUT"
          else
            echo "llm=0" >> "$GITHUB_OUTPUT"
          fi
          # The 7:00 PT run used to also carry a 25-minute FB-post retry: it
          # waited for the overnight report to land before posting. Social posting
          # moved to the local KO job (see the note at the end of this file), so
          # that retry fed a step that no longer runs. Removed 2026-10-06.
          echo "Pacific hour is $H (LLM build at 6, or 7-9 with no brief yet)"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Build site (fetch sources → bake static HTML)
        id: build
        run: python build/build_all.py ${{ steps.gate.outputs.llm == '0' && '--no-llm' || '' }}

      # UptimeRobot freshness ping: fires ONLY when today's Kern Overnight
      # report exists in the repo (i.e. the overnight pipeline ran and
      # pushed). A missed publish = missed ping = UptimeRobot alert.
      # The URL comes from a Cron-monitor in UptimeRobot (see
      # scripts/resilience-setup.md); until the secret is set, this skips.
      - name: Ping UptimeRobot if today's overnight report exists
        if: (steps.gate.outputs.hour == '6' || github.event_name != 'schedule') && env.UP_OVERNIGHT_PING_URL != ''
        env:
          UP_OVERNIGHT_PING_URL: ${{ secrets.UP_OVERNIGHT_PING_URL }}
        run: |
          TODAY=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/Los_Angeles')).strftime('%Y-%m-%d'))")
          if [ -f "data/overnight_reports/$TODAY.md" ]; then
            curl -fsS -m 20 "$UP_OVERNIGHT_PING_URL" && echo "overnight ping sent ($TODAY)"
          else
            echo "no overnight report for $TODAY — ping skipped (alert is the correct signal)"
          fi

      # ffmpeg is for the test suite only (the @needs_ffmpeg tests in tests/test_reel_audio.py):
      # the build never calls it, and the reel is rendered on the box. A pinned static build
      # from GitHub's own release CDN and cache, not apt: the Ubuntu mirror held the old apt
      # step 14 to 36 minutes on 8 runs in October 2026. Here, after the build, so a failed
      # install can never hold the build, the artifact push or the deploy. It fails the step
      # with one annotation, the test suite does not run, and the run is red.
      - name: Set up ffmpeg (pinned static build)
        id: ffmpeg
        uses: ./.github/actions/setup-ffmpeg

      # Test suite FIRST: it used to sit after the artifact push, so a broken build had
      # already pushed a commit to main before the "gate" ran. A failure stops the push.
      # It does NOT stop the deploy and the send (both carry `if: !cancelled()`): on
      # 2026-10-14 and 2026-10-15 a red test was enough to skip the artifact push while
      # the site still deployed, so data/briefs/<date>.json never landed, the 09:15
      # social gate refused both slots, and the day posted nothing with every alarm
      # green. The push now runs whenever the build succeeded, and the run still goes
      # red, which is the signal that was missing.
      - name: Test suite (hard gate before the artifact push)
        id: tests
        run: python -m pytest -q -o addopts="" --tb=short

      # Automatic pusher: commit the generated artifacts (email/, drafts/, data/)
      # so the email renderings and review drafts are always in the repo.
      - name: Commit generated artifacts
        # scripts/ci_push.sh: pushes only CI-owned artifacts, fails loudly on an ownership conflict
        # (an ::error annotation) instead of a green step with nothing pushed. NO
        # continue-on-error: masking a failed push as a green step is how a whole day of
        # artifacts disappears behind a passing run.
        # The condition matches the deploy: a red TEST must not withhold the artifacts,
        # because the same build has already been deployed to the live site and the
        # social/email legs read the committed brief. Not running is only correct when
        # the BUILD failed and there is nothing trustworthy to commit.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: push
        run: |
          bash scripts/ci_push.sh "build: $(date -u +%Y-%m-%d) artifacts [skip ci]"

      # Newsletter send: once per day at the 8:00 PT build (or any later
      # run — the gate is hour >= 8, not == 8, so a GitHub-schedule delay
      # that lands the run at 9:00/10:00 still sends instead of silently
      # skipping). NOTE: fromJSON() is required — a raw string comparison
      # ('15' >= '8') is lexicographic and fails for hours 10+.
      # The script is idempotent (checks MailerLite for today's campaign
      # first), so a delayed run + the Hermes watchdog can never double-send.
      # Without the key the script no-ops (prints the ready-to-send path) so
      # CI never breaks.
      # SEND RUNS AFTER THE DEPLOY so a blocked/failed email can never hold up
      # the site. It deliberately FAILS the job (NO continue-on-error) when the
      # email is blocked or the send errors — a skipped email must be a RED run
      # a human sees, never a silent green check — and a notification step posts
      # to the ops Discord channel so nobody has to grep run logs.
      - name: Set MailerLite Pages secrets (for the newsletter function)
        id: pages_secrets
        if: ${{ !cancelled() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          MAILERLITE_GROUP_ID: ${{ secrets.MAILERLITE_GROUP_ID }}
        run: |
          set -o pipefail   # without it, "| tail -1" hid a failed secret put
          echo "$MAILERLITE_API_TOKEN" | npx wrangler pages secret put MAILERLITE_API_TOKEN --project-name=bakersfieldbrief 2>&1 | tail -1
          echo "$MAILERLITE_GROUP_ID" | npx wrangler pages secret put MAILERLITE_GROUP_ID --project-name=bakersfieldbrief 2>&1 | tail -1

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: ${{ !cancelled() }}   # a failed artifact push must not withhold the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=bakersfieldbrief

      # FAIL LOUDLY when the camera data on /surveillance/ is not today's. The alpr source
      # answers a failed Overpass fetch with its last good list and ok=True, so the build
      # stays green; before this step an outage was invisible until the Monday verify in
      # weekly.yml. Now it is a red run and an ops Discord alert on the run it happens.
      # AFTER the deploy on purpose: placed before the push it would skip the artifact push
      # (and with it every other tracker's data) over a source that already has a correct
      # fallback. The page itself never mentions any of this: the red run and the alert are
      # the whole signal.
      # Only when the build succeeded: a crashed build is its own failure, and its leftover
      # payload would be reported here as an Overpass outage that never happened.
      # NO continue-on-error: a stale fallback must never read as green.
      - name: Verify the ALPR camera data is today's
        id: alpr_fresh
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/check_alpr_fresh.py --alert-file /tmp/bb_alpr.txt

      # The step above cannot report a run that never started (GitHub drops and delays
      # scheduled runs, and disables schedules on an idle repo). This ping fires ONLY on a
      # proven-fresh fetch, so a dead-man's-switch check (healthchecks.io, period 1 day) alerts
      # when a day passes without one, whatever the cause. Setup: scripts/resilience-setup.md,
      # "ALPR freshness". Until the secret exists the run says so in a notice instead of
      # skipping in silence.
      - name: Ping the ALPR freshness heartbeat
        if: ${{ !cancelled() && steps.alpr_fresh.outcome == 'success' }}
        env:
          UP_ALPR_PING_URL: ${{ secrets.UP_ALPR_PING_URL }}
        run: |
          if [ -z "$UP_ALPR_PING_URL" ]; then
            echo "::notice title=ALPR heartbeat not configured::UP_ALPR_PING_URL is not set, so nothing alerts when the daily run does not start at all. The in-run freshness check above is unaffected."
            exit 0
          fi
          curl -fsS -m 20 "$UP_ALPR_PING_URL" && echo "ALPR freshness ping sent"

      # Newsletter send — runs AFTER deploy so a blocked/failed email can never
      # hold up the site, but NO continue-on-error: a blocked send exits 1 and
      # FAILS the job, so `gh run list` shows RED, not a silent green check.
      - name: Send daily newsletter (MailerLite)
        if: ${{ !cancelled() && fromJSON(steps.gate.outputs.hour) >= 8 }}
        id: send
        env:
          MAILERLITE_API_TOKEN: ${{ secrets.MAILERLITE_API_TOKEN }}
          MAILERLITE_GROUP_ID: ${{ secrets.MAILERLITE_GROUP_ID }}
        run: |
          set +e
          python scripts/send_newsletter_ml.py > /tmp/bb_send.out 2>&1
          code=$?
          cat /tmp/bb_send.out
          # surface the failure reason to the notify step (job-level env)
          { echo "BB_SEND_MSG<<EOF"; tail -6 /tmp/bb_send.out; echo "EOF"; } >> "$GITHUB_ENV"
          exit $code

      # The alert that needs no secret. The Discord step below depends on DISCORD_WEBHOOK_URL;
      # without it a failed run told nobody. This comments on the pinned ops issue with the
      # run's own token (`issues: write`; the repo is private, so nothing is published).
      # It reports a run that is already red and must never be why one is, or change which
      # step a reader blames: the script always exits 0, and if it cannot even start (a failed
      # checkout) the step says so in an annotation and still passes.
      - name: Comment on the ops issue on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPS_JSON: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/notify_issue.py --header "Bakersfield Brief - daily run #$GITHUB_RUN_NUMBER failed" --file /tmp/bb_alpr.txt --file /tmp/bb_send.out \
            || echo "::error title=ops issue alert not delivered::scripts/notify_issue.py could not run"

      # A failed run must reach a human the same morning, not sit in run logs. Posts to the
      # ops Discord webhook. `if: failure()` is the reliable GitHub Actions condition (fires
      # when any prior step in the job failed) - `steps.send.outcome == 'failure'` proved
      # unreliable and skipped the alert on 2026-09-06. Without the secret it still fails
      # loudly in the log (never silent).
      # Two alerts, because they are two different jobs for the reader:
      #  - the ALPR one, when the freshness step failed (its text comes from that step);
      #  - the build/email one, for everything else. It is skipped only when the ALPR step is
      #    the ONE failure, which is spelled out step by step below: any step that did not
      #    plainly succeed keeps the second alert, so a doubt costs a duplicate, not a miss.
      # The email header used to key on "the send step ran". With a step that can fail while
      # the send succeeds, that printed "email did NOT send" for an email that went out; it
      # reads the send step's own outcome now.
      - name: Notify ops Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALPR_OUTCOME: ${{ steps.alpr_fresh.outcome }}
          SEND_OUTCOME: ${{ steps.send.outcome }}
          ALPR_ONLY: ${{ steps.alpr_fresh.outcome == 'failure' && steps.tests.outcome == 'success' && steps.push.outcome == 'success' && steps.pages_secrets.outcome == 'success' && steps.deploy.outcome == 'success' && steps.send.outcome != 'failure' }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "!! DISCORD_WEBHOOK_URL secret not set - the run failed (alpr=$ALPR_OUTCOME send=$SEND_OUTCOME) and NO Discord alert could be sent. See $RUN_URL"
            exit 1
          fi
          rc=0
          if [ "$ALPR_OUTCOME" = "failure" ]; then
            if [ ! -f /tmp/bb_alpr.txt ]; then
              printf 'The ALPR freshness step failed without writing a reason. Read the run log.\n' > /tmp/bb_alpr.txt
            fi
            printf 'See: %s\n' "$RUN_URL" >> /tmp/bb_alpr.txt
            python scripts/notify_discord.py --header "Bakersfield Brief - ALPR tracker data is NOT fresh (run #$GITHUB_RUN_NUMBER)" --file /tmp/bb_alpr.txt \
              && echo "ops Discord alert sent for the ALPR tracker" || rc=1
          fi
          if [ "$ALPR_ONLY" != "true" ]; then
            if [ "$SEND_OUTCOME" = "failure" ]; then
              HDR="Bakersfield Brief - daily email did NOT send (run #$GITHUB_RUN_NUMBER)"
              printf 'A blocked/failed send is now a RED run - not silent.\n```\n' > /tmp/bb_discord.txt
              tail -6 /tmp/bb_send.out >> /tmp/bb_discord.txt
              printf '\n```\n' >> /tmp/bb_discord.txt
            elif [ -f /tmp/bb_send.out ]; then
              # a test, push or deploy failure on a run whose email went out is not a missed email
              HDR="Bakersfield Brief - daily build had a failed step; the email DID send (run #$GITHUB_RUN_NUMBER)"
              printf 'A step of the daily run failed. The newsletter send itself succeeded.\n' > /tmp/bb_discord.txt
            else
              HDR="Bakersfield Brief - daily build failed before the send step (run #$GITHUB_RUN_NUMBER)"
              printf 'A step of the daily run failed.\n' > /tmp/bb_discord.txt
              printf '(send step did not run - not due on this run, or an earlier step failed and the email was never attempted)\n' >> /tmp/bb_discord.txt
            fi
            printf 'See: %s\n' "$RUN_URL" >> /tmp/bb_discord.txt
            python scripts/notify_discord.py --header "$HDR" --file /tmp/bb_discord.txt \
              && echo "ops Discord alert sent for the failed run" || rc=1
          fi
          exit $rc

      # Social post: intentionally NOT run from CI. The 2026-08 "withheld" API
      # posts were caused by the Meta app being Unpublished (dev mode), fixed
      # 2026-09-29. Posting now runs LOCALLY in the KO social job
      # (scripts/brief_reel/publish_social.py -> scripts/social_api.py): Graph
      # API only for FB+IG reel and story (the Playwright fallback was retired
      # 2026-10-06: the retry slot re-runs the API, which skips live legs). It
      # stays local because the reel carries real scanner dispatch audio that
      # only exists on the capture machine; this CI step would post a
      # music-bed-only reel and pre-empt it. Kept for reference only.
      # - name: Post summary to Facebook
      #   env:
      #     FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      #     FB_PAGE_ID: "1298315170026203"
      #     (the FB_RETRY_MINUTES input went with the retry gate output, removed 2026-10-06)
      #   run: python scripts/post_facebook.py
