name: Daily Brief (6am PT)

on:
  schedule:
    # Run at 13:00 and 14:00 UTC so the 6am-Pacific gate below hits 6:00 PT
    # year-round regardless of daylight saving. The second run exits early.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate to 6am Pacific
        id: gate
        run: |
          H=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/Los_Angeles')).hour)")
          echo "hour=$H" >> "$GITHUB_OUTPUT"
          echo "Pacific hour is $H (build runs when == 6)"

      - name: Install dependencies
        if: steps.gate.outputs.hour == '6' || github.event_name != 'schedule'
        run: pip install -q -r requirements.txt

      - name: Build site (fetch sources → bake static HTML)
        if: steps.gate.outputs.hour == '6' || github.event_name != 'schedule'
        run: python build/build_all.py

      # UptimeRobot freshness ping: fires ONLY when today's Kern Overnight
      # report exists in the repo (i.e. the overnight pipeline ran and
      # pushed). A missed publish = missed ping = UptimeRobot alert.
      # The URL comes from a Cron-monitor in UptimeRobot (see
      # scripts/resilience-setup.md); until the secret is set, this skips.
      - name: Ping UptimeRobot if today's overnight report exists
        if: (steps.gate.outputs.hour == '6' || github.event_name != 'schedule') && env.UP_OVERNIGHT_PING_URL != ''
        env:
          UP_OVERNIGHT_PING_URL: ${{ secrets.UP_OVERNIGHT_PING_URL }}
        run: |
          TODAY=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/Los_Angeles')).strftime('%Y-%m-%d'))")
          if [ -f "data/overnight_reports/$TODAY.md" ]; then
            curl -fsS -m 20 "$UP_OVERNIGHT_PING_URL" && echo "overnight ping sent ($TODAY)"
          else
            echo "no overnight report for $TODAY — ping skipped (alert is the correct signal)"
          fi

      # Automatic pusher: commit the generated artifacts (email/, drafts/, data/)
      # so the email renderings and review drafts are always in the repo.
      - name: Commit generated artifacts
        if: steps.gate.outputs.hour == '6' || github.event_name != 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email drafts data
          if ! git diff --cached --quiet; then
            git commit -m "build: $(date -u +%Y-%m-%d) artifacts [skip ci]"
            # concurrent workflows can race the push — rebase and retry
            for i in 1 2 3; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase origin main --autostash; then
                git push && break
              else
                git checkout --ours -- data email drafts 2>/dev/null || true
                git add -A
                git -c core.editor=true rebase --continue 2>/dev/null || git rebase --abort
                git push && break
              fi
              echo "push retry $i"; sleep 8
            done
          else
            echo "no artifact changes"
          fi

      - name: Upload Pages artifact
        if: steps.gate.outputs.hour == '6' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.hour == '6' || github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v4
