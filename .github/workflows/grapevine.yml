name: Grapevine Conditions (3x daily)

on:
  schedule:
    # Three times daily, year-round: 6am / 1pm / 7pm Pacific (13, 20, 2 UTC).
    # DST shifts the exact minute by an hour twice a year — acceptable for a
    # highway-conditions page (the timestamp shown is Caltrans', not ours).
    # :30, not :00. All five workflows share the "pages" concurrency group, and GitHub keeps only
    # one pending run per group: a grapevine run queued at 13:00 UTC could cancel the daily
    # workflow's 6 AM brief build waiting behind it.
    # Minute 37 for the same reason the daily workflow moved to minute 7: :00 and :30 are
    # the slots GitHub starts latest.
    # 13 UTC dropped 2026-10-26 for Actions minutes: this job is the same build_all --no-llm
    # as daily.yml, which already builds at 13:07 and 14:07 UTC, so the Caltrans reading at
    # 6 AM Pacific comes from those. 20 and 2 UTC stay: daily.yml has no slot near them.
    - cron: "37 20,2 * * *"
    # SEASONAL — hourly, November through March (snow season on Tejon Pass).
    # To enable, uncomment the line below (and optionally comment the 3x-daily
    # line above; the two overlap harmlessly if both are active, at the cost
    # of ~24 extra 2-minute runs/day ≈ 1,500 Actions minutes/month — still
    # inside the 2,000-min free tier with the other workflows, but tight).
    # - cron: "0 * 1-31 11-3 *"   # hourly, Nov–Mar (UTC hour 0-23)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      ALERTLINE_API_KEY: ${{ secrets.ALERTLINE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Build site (incl. Caltrans road conditions)
        id: build
        # --no-llm: only the daily brief (daily.yml) and the Sunday Read use the AI writer. Without
        # it this build re-ran the daily builder's AI calls three times a day for nothing.
        run: python build/build_all.py --no-llm

      - name: Commit generated artifacts
        # scripts/ci_push.sh: pushes only CI-owned artifacts, fails loudly on an ownership conflict
        # (an ::error annotation) instead of a green step with nothing pushed. NO
        # continue-on-error: masking a failed push as a green step is how a whole day of
        # artifacts disappears behind a passing run. The steps that must still happen
        # (deploy, send) carry `if: !cancelled()`.
        run: |
          bash scripts/ci_push.sh "build: $(date -u +%Y-%m-%d) road conditions [skip ci]"

      # /api/fog-delays is a Pages Function: it reads the AlertLine key when a
      # visitor loads the page, so the Pages project needs the key as well as the
      # build. GitHub secrets cannot be tested in a step-level `if:`, so the guard
      # is in the shell. Never blocks the deploy, hence continue-on-error.
      - name: Push the AlertLine key into the Pages project
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALERTLINE_API_KEY: ${{ secrets.ALERTLINE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ALERTLINE_API_KEY:-}" ]; then
            echo "ALERTLINE_API_KEY is not a GitHub secret yet - skipping."
            exit 0
          fi
          echo "$ALERTLINE_API_KEY" | npx --yes wrangler@3 pages secret put ALERTLINE_API_KEY --project-name=bakersfieldbrief
          echo "pages secret set"

      - name: Deploy to Cloudflare Pages
        if: ${{ !cancelled() }}   # a failed artifact push must not withhold the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=bakersfieldbrief

      # Same gate as daily.yml. This run fetches the camera list and deploys /surveillance/
      # too, so a fallback to the last good list here has to be red as well, not a green run
      # that the next daily run happens to correct. After the deploy, so it never withholds
      # the site. NO continue-on-error: a stale fallback must never read as green.
      - name: Verify the ALPR camera data is today's
        id: alpr_fresh
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/check_alpr_fresh.py --alert-file /tmp/bb_alpr.txt

      # The alert that needs no secret. The Discord step below depends on DISCORD_WEBHOOK_URL;
      # without it a failed run told nobody. This comments on the pinned ops issue with the
      # run's own token (`issues: write`; the repo is private, so nothing is published).
      # It reports a run that is already red and must never be why one is, or change which
      # step a reader blames: the script always exits 0, and if it cannot even start (a failed
      # checkout) the step says so in an annotation and still passes.
      - name: Comment on the ops issue on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPS_JSON: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/notify_issue.py --header "Bakersfield Brief - grapevine run #$GITHUB_RUN_NUMBER failed" --file /tmp/bb_alpr.txt \
            || echo "::error title=ops issue alert not delivered::scripts/notify_issue.py could not run"

      # `if: failure()` and the outcome read in the shell, as in daily.yml: a step-outcome
      # expression in `if:` skipped an alert there on 2026-09-06. Any other failed step of
      # this workflow is reported exactly as before (the red run); this alert is the ALPR one.
      - name: Notify ops Discord when the ALPR data is not fresh
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALPR_OUTCOME: ${{ steps.alpr_fresh.outcome }}
        run: |
          if [ "$ALPR_OUTCOME" != "failure" ]; then
            echo "the ALPR freshness step did not fail (outcome=$ALPR_OUTCOME) - no ALPR alert"
            exit 0
          fi
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "!! DISCORD_WEBHOOK_URL secret not set - the ALPR data is not fresh and NO Discord alert could be sent. See $RUN_URL"
            exit 1
          fi
          if [ ! -f /tmp/bb_alpr.txt ]; then
            printf 'The ALPR freshness step failed without writing a reason. Read the run log.\n' > /tmp/bb_alpr.txt
          fi
          printf 'See: %s\n' "$RUN_URL" >> /tmp/bb_alpr.txt
          python scripts/notify_discord.py --header "Bakersfield Brief - ALPR tracker data is NOT fresh (grapevine run #$GITHUB_RUN_NUMBER)" --file /tmp/bb_alpr.txt
