name: Weekend Guide (Thu)

on:
  schedule:
    # Thursdays ~6:30am PT (14:30 UTC; DST shifts it an hour — fine for a
    # weekly review draft; the daily workflow is the exact-time build).
    - cron: "30 14 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # --guide scrapes the venue whitelist and renders the Weekend Guide:
      #   drafts/weekend-guide-<date>/  → email drafts (HUMAN REVIEW)
      #   site/guide/index.html         → auto-published site page
      - name: Build site + Weekend Guide
        run: python build/build_all.py --guide

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email drafts data
          if ! git diff --cached --quiet; then
            git commit -m "build: $(date -u +%Y-%m-%d) guide artifacts [skip ci]"
            for i in 1 2 3; do
              git rebase --abort 2>/dev/null
              if git pull --rebase origin main --autostash; then
                git push && break
              else
                git checkout --ours -- data email drafts 2>/dev/null || true
                git add -A
                git -c core.editor=true rebase --continue 2>/dev/null || git rebase --abort
                git push && break
              fi
              echo "push retry $i"; sleep 8
            done
          else
            echo "no artifact changes"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
