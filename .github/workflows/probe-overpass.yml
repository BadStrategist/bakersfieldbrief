name: probe overpass (manual)

# One-off diagnostic: which Overpass servers can a GitHub runner actually reach
# with the ALPR query? Manual only. Remove once a mirror has been chosen.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Probe each server with the real query
        run: |
          python - <<'PY'
          import sys, time
          sys.path.insert(0, ".")
          import requests
          from build import common
          from build.sources import alpr
          servers = [
              "https://overpass-api.de/api/interpreter",
              "https://overpass.private.coffee/api/interpreter",
              "https://overpass.kumi.systems/api/interpreter",
              "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
              "https://overpass.osm.jp/api/interpreter",
          ]
          for url in servers:
              t = time.time()
              try:
                  r = requests.post(url, data={"data": alpr.QUERY}, timeout=60,
                                    headers={"User-Agent": common.UA})
                  n = len(r.json().get("elements", [])) if r.ok else "-"
                  print(f"RESULT {url} http={r.status_code} nodes={n} secs={time.time() - t:.1f}")
              except Exception as e:
                  print(f"RESULT {url} FAILED {type(e).__name__} secs={time.time() - t:.1f}")
          PY
