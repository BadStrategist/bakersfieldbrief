name: Sunday Read (Sun)

on:
  schedule:
    # Sundays ~6:30am PT (14:30 UTC; DST shifts it an hour — fine for a
    # weekly feature; the daily workflow is the exact-time build).
    - cron: "37 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      ALERTLINE_API_KEY: ${{ secrets.ALERTLINE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # --sunday writes the weekly long-form feature from this week's real
      # data (LLM writer in CI) and caches it to data/last_sunday_read.json;
      # off-Sunday builds render the cached piece so the page never goes empty.
      - name: Build site + Sunday Read
        run: python build/build_all.py --sunday

      - name: Commit generated artifacts
        # scripts/ci_push.sh: pushes only CI-owned artifacts, fails loudly on an ownership conflict
        # (an ::error annotation) instead of a green step with nothing pushed. NO
        # continue-on-error: masking a failed push as a green step is how a whole day of
        # artifacts disappears behind a passing run. The steps that must still happen
        # (deploy, send) carry `if: !cancelled()`.
        run: |
          bash scripts/ci_push.sh "build: $(date -u +%Y-%m-%d) sunday-read artifacts [skip ci]"

      - name: Deploy to Cloudflare Pages
        if: ${{ !cancelled() }}   # a failed artifact push must not withhold the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=bakersfieldbrief
