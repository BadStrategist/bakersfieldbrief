name: Weekly Trackers (Mon)

on:
  schedule:
    # Mondays ~7:30am PT (14:30 UTC; DST shifts it by an hour — acceptable for
    # a weekly tracker run; the daily workflow is the exact-time build).
    - cron: "30 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      ALERTLINE_API_KEY: ${{ secrets.ALERTLINE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # Full rebuild: guarantees the ALPR weekly change-log diff appends on
      # Mondays even if a daily run was missed, and is the natural home for
      # moving individual source jobs to a self-hosted runner later.
      - name: Build site
        # --no-llm: only the daily brief (daily.yml) and the Sunday Read use the AI writer. Without
        # it this build re-ran the daily builder's AI calls again for nothing.
        run: python build/build_all.py --alpr-change --no-llm

      - name: Commit generated artifacts
        # scripts/ci_push.sh: keeps THIS run's data on a rebase conflict and flags a failed push
        # (an ::error annotation) instead of a green step with nothing pushed. It never blocks the
        # deploy or the send, hence continue-on-error.
        continue-on-error: true
        run: |
          bash scripts/ci_push.sh "build: $(date -u +%Y-%m-%d) weekly artifacts [skip ci]"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=bakersfieldbrief
