name: Weekly Trackers (Mon)

on:
  schedule:
    # Mondays ~7:30am PT (14:30 UTC; DST shifts it by an hour — acceptable for
    # a weekly tracker run; the daily workflow is the exact-time build).
    - cron: "37 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      ALERTLINE_API_KEY: ${{ secrets.ALERTLINE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # Full rebuild: guarantees the ALPR weekly change-log diff appends on
      # Mondays even if a daily run was missed, and is the natural home for
      # moving individual source jobs to a self-hosted runner later.
      - name: Build site
        # --no-llm: only the daily brief (daily.yml) and the Sunday Read use the AI writer. Without
        # it this build re-ran the daily builder's AI calls again for nothing.
        run: python build/build_all.py --alpr-change --no-llm

      # FAIL LOUDLY if the weekly diff did not land. This Monday run is the only
      # writer of the ALPR change-log row (the local job is retired), so a silent
      # skip freezes /surveillance/, the site's top search page. The row is dated
      # in PACIFIC time; a manual dispatch after 5pm PT must not read as a failure.
      - name: Verify the ALPR change-log row
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("America/Los_Angeles")).date().isoformat()
          rows = json.load(open("data/change_logs/alpr.json", encoding="utf-8")) or []
          last = (rows[-1] or {}).get("date") if rows else None

          stale, why = None, ""
          if os.path.exists("data/source_cache.json"):
              alpr = (json.load(open("data/source_cache.json", encoding="utf-8")) or {}).get("alpr") or {}
              stale = alpr.get("stale")
              why = " ".join(str(alpr.get("error") or "").split())[:400]

          print(f"alpr rows={len(rows)} last={last} today(PT)={today} stale={stale}")

          # A shrunk log means load_change_log hit unreadable JSON, returned [], and the
          # append then rewrote the history as a single row (this repo has shipped rebase
          # markers into artifacts before). Compare against the committed version at HEAD.
          import subprocess
          try:
              prev_txt = subprocess.run(
                  ["git", "show", "HEAD:data/change_logs/alpr.json"],
                  capture_output=True, text=True, check=True).stdout
              prev_n = len(json.loads(prev_txt or "[]"))
              if len(rows) < prev_n:
                  print(f"ERROR: the change log shrank from {prev_n} rows at HEAD to {len(rows)}: "
                        "a corrupt or truncated log was rewritten over the history", file=sys.stderr)
                  sys.exit(1)
          except subprocess.CalledProcessError as exc:
              print(f"WARNING: no committed log to compare against (rc={exc.returncode}); "
                    "the size check was skipped")

          if stale:
              # Either Overpass could not be reached, or a newly mapped camera could not be
              # dated and the source refused the row. The reason is the source's own text.
              print(f"ERROR: the Overpass/OSM fetch failed and the build reused a stale cache: {why}", file=sys.stderr)
              sys.exit(1)
          if last != today:
              print(f"ERROR: no ALPR change-log row for the Pacific date {today} (last row is {last})", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Commit generated artifacts
        # scripts/ci_push.sh stages only the CI-owned paths, warns when CI leaves a box-owned path
        # dirty, and flags a failed push (an ::error annotation) instead of a green step with
        # nothing pushed. NO continue-on-error: a masked push is a green run with no
        # artifacts. Downstream steps carry `if: !cancelled()`.
        run: |
          bash scripts/ci_push.sh "build: $(date -u +%Y-%m-%d) weekly artifacts [skip ci]"

      - name: Deploy to Cloudflare Pages
        if: ${{ !cancelled() }}   # a failed artifact push must not withhold the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=bakersfieldbrief

      # The alert that needs no secret. The Discord step below depends on DISCORD_WEBHOOK_URL;
      # without it a failed run told nobody. This comments on the pinned ops issue with the
      # run's own token (`issues: write`; the repo is private, so nothing is published).
      # It reports a run that is already red and must never be why one is, or change which
      # step a reader blames: the script always exits 0, and if it cannot even start (a failed
      # checkout) the step says so in an annotation and still passes.
      - name: Comment on the ops issue on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEPS_JSON: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/notify_issue.py --header "Bakersfield Brief - weekly run #$GITHUB_RUN_NUMBER failed" \
            || echo "::error title=ops issue alert not delivered::scripts/notify_issue.py could not run"

      # A failed ALPR verify or a failed deploy must reach a human: this Monday run is the
      # only writer of the change-log row that /surveillance/ renders, so a silent failure
      # freezes the site's top search page. Without the secret it still fails loudly in the
      # log (never silent).
      - name: Notify ops Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "!! DISCORD_WEBHOOK_URL secret not set - the weekly tracker run failed and NO Discord alert could be sent. See $RUN_URL"
            exit 1
          fi
          printf 'The weekly tracker run FAILED. The ALPR change-log row may be missing this week.\n' > /tmp/bb_weekly.txt
          printf 'run: %s\n' "$RUN_URL" >> /tmp/bb_weekly.txt
          python scripts/notify_discord.py --header "Bakersfield Brief - weekly trackers FAILED (run #$GITHUB_RUN_NUMBER)" --file /tmp/bb_weekly.txt

      # The land ownership on /surveillance/ is a hand-researched join made on the local box
      # (the Flock transparency portals block datacenter IPs), so CI cannot refresh it. The
      # page prints its date and how many cameras are waiting, but nothing told a human when
      # it fell behind. This posts a Monday reminder when a refresh is due. It is NOT a
      # failure of this run and must not be read as one, so it sits after the failure alert
      # and never marks the change-log row as missing. An undeliverable reminder prints an
      # ::error annotation and still exits 0: a red Monday has to keep meaning "the change-log
      # row may be missing", or the signal this step exists to protect gets buried.
      - name: Remind ops when the land ownership join is due
        if: ${{ !cancelled() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          rm -f /tmp/bb_own.txt
          python scripts/check_alpr_fresh.py --ownership --alert-file /tmp/bb_own.txt
          if [ ! -f /tmp/bb_own.txt ]; then
            echo "land ownership join is current - no reminder"
            exit 0
          fi
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error title=Ownership reminder not delivered::DISCORD_WEBHOOK_URL is not set, so the reminder above reached nobody."
            echo "Not failing this run: this step is a reminder, not the weekly job. Set the secret to deliver it."
            exit 0
          fi
          python scripts/notify_discord.py --header "Bakersfield Brief - ALPR land ownership join is due (reminder, not a failure)" --file /tmp/bb_own.txt
