name: workers

# Deploys the standalone Workers in workers/. Scope is narrow on purpose: this
# job must not run on ordinary site pushes (Actions minutes are the budget).
on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/workers.yml"
  workflow_dispatch:

concurrency:
  group: workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy grapevine-watchdog
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/grapevine-watchdog
          command: deploy

      # The alert leg needs a Discord webhook. GitHub secrets cannot be tested in
      # a step-level `if:`, so the guard is in the shell. Until the secret exists
      # the Worker still runs its check and reports delivery="not_deliverable".
      - name: Push the Discord webhook into the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not a GitHub secret yet - skipping."
            echo "The Worker's check still runs; its alert leg stays inert until it is set."
            exit 0
          fi
          cd workers/grapevine-watchdog
          echo "$DISCORD_WEBHOOK_URL" | npx --yes wrangler@3 secret put DISCORD_WEBHOOK_URL --name grapevine-watchdog
          echo "worker secret set"

      # Prove the Worker is actually serving, not just that wrangler exited 0.
      # The check is only real if this step fetches the deployed URL and reads
      # the JSON body the fetch handler returns.
      - name: Verify the deployed Worker answers
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SUB=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')
          URL="https://grapevine-watchdog.$SUB.workers.dev"
          echo "worker url: $URL"
          code=$(curl -s -o /tmp/gw.json -w '%{http_code}' "$URL")
          echo "live check http=$code"
          cat /tmp/gw.json
          echo
          test "$code" = "200"
          grep -q '"worker": "grapevine-watchdog"' /tmp/gw.json
          python3 - <<'PY'
          import json
          j = json.load(open("/tmp/gw.json"))
          print(f"state={j['state']} age={j.get('ageMinutes')}m delivery={j['delivery']}")
          assert j["state"] in ("ok", "stale"), j
          PY
          echo "worker verified live"